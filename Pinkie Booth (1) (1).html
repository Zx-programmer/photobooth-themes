<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pinkie Booth — Your Little Cute World ♡</title>

  <!-- Google Fonts: Gaegu (cute handwritten), Plus Jakarta Sans (clean text), Mali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mali:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            babypink: '#ffe4e6',
            pastelpink: '#fecdd3',
            rosered: '#f43f5e',
            cream: '#fff1f2',
            burgundy: '#881337',
            deepburgundy: '#4c0519',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            cute: ['"Gaegu"', 'cursive'],
            handwritten: ['"Mali"', 'cursive'],
          },
          animation: {
            'float': 'float 4s ease-in-out infinite',
            'sparkle': 'sparkle 2s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
            'pop-in': 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-10px) rotate(3deg)' },
            },
            sparkle: {
              '0%, 100%': { opacity: 0.4, transform: 'scale(0.9)' },
              '50%': { opacity: 1, transform: 'scale(1.15)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: 1, transform: 'scale(1)' },
              '50%': { opacity: 0.92, transform: 'scale(1.02)' },
            },
            popIn: {
              '0%': { opacity: 0, transform: 'scale(0.8)' },
              '100%': { opacity: 1, transform: 'scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM UMD CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Global script -->

  <style>

    body {
      background-color: #fff1f2;
      background-image: radial-gradient(#fecdd3 1px, transparent 1px);
      background-size: 20px 20px;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;

    ::-webkit-scrollbar-track {
      background: #ffe4e6;
    }
    ::-webkit-scrollbar-thumb {

      border-radius: 9999px;

    .ribbon-banner {
      background: linear-gradient(135deg, #f43f5e, #be185d);
    }
    .canvas-container {
      touch-action: none;
    }
  </style>
</head>
<body class="text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-200 selection:text-rose-900">

  <!-- Root React App Container -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // 1. CONSTANTS, PRESETS & COLLECTIONS
    // ==========================================
    const THEMES = [
      { id: 'pink-coquette', name: 'Pink Coquette 🎀', bg: '#ffe4e6', frame: '#ffffff', border: '#f43f5e', text: '#9f1239', pattern: 'hearts' },
      { id: 'strawberry-milk', name: 'Strawberry Milk 🍓', bg: '#fff1f2', frame: '#fecdd3', border: '#fb7185', text: '#e11d48', pattern: 'polka' },
      { id: 'dreamy-garden', name: 'Dreamy Garden 🌷', bg: '#f0fdf4', frame: '#ffffff', border: '#86efac', text: '#166534', pattern: 'sparkles' },
      { id: 'korean-booth', name: 'Cute Korean Booth 🩷', bg: '#fdf2f8', frame: '#fbcfe8', border: '#f472b6', text: '#be185d', pattern: 'none' },
      { id: 'burgundy-luxury', name: 'Burgundy Luxury 🍒', bg: '#4c0519', frame: '#881337', border: '#f43f5e', text: '#ffe4e6', pattern: 'stars' },

      { id: 'scrapbook-diary', name: 'Scrapbook Diary 📔', bg: '#fffbe8', frame: '#fef08a', border: '#ca8a04', text: '#713f12', pattern: 'stripes' },
      { id: 'ice-cream-party', name: 'Ice Cream Party 🍦', bg: '#ecfeff', frame: '#cffafe', border: '#22d3ee', text: '#155e75', pattern: 'sparkles' },
      { id: 'minimalist-film', name: 'Minimalist Film 🎞️', bg: '#18181b', frame: '#27272a', border: '#52525b', text: '#f4f4f5', pattern: 'none' }

    const PERSONAL_ITEMS = [
      { id: 'gelang', name: 'Gelang Manik-Manik', emoji: '📿', note: 'Aksoris imut & warna-warni favorit', category: 'Fashion' },
      { id: 'tas', name: 'Tas Mini', emoji: '👜', note: 'Pelengkap outfit cantik sehari-hari', category: 'Fashion' },
      { id: 'flatshoes', name: 'Flatshoes Lucu', emoji: '🥿', note: 'Nyaman dipakai jalan-jalan', category: 'Fashion' },
      { id: 'keychain', name: 'Keychain Karakter', emoji: '🔑', note: 'Gantungan kunci lucu gemas', category: 'Hobby' },
      { id: 'boneka', name: 'Boneka Plushie', emoji: '🧸', note: 'Teman tidur ter-soft & empuk', category: 'Hobby' },
      { id: 'bunga', name: 'Bunga Fresh', emoji: '🌷', note: 'Selalu sukses bikin mood happy', category: 'Nature' },
      { id: 'parfum', name: 'Scarlett Velvet Rouge', emoji: '🧴', note: 'WANGI BGT SUKAK ♡', category: 'Beauty' },
      { id: 'iphone', name: 'iPhone Burgundy', emoji: '📱', note: 'Warna burgundy paling estetis', category: 'Tech' },
      { id: 'lambo', name: 'Lamborghini', emoji: '🏎️', note: 'Dream car mewah sepanjang masa', category: 'Dream' },
      { id: 'pashmina', name: 'Pashmina Ceruty', emoji: '🧣', note: 'Bahan halus & mudah dibentuk', category: 'Fashion' },
      { id: 'pink', name: 'Semua Warna Pink', emoji: '🩷', note: 'Warna kebahagiaan nomor satu', category: 'Aesthetic' },
      { id: 'cute-things', name: 'Barang-Barang Imut', emoji: '🎀', note: 'Pita, glitter, & barang kecil', category: 'Aesthetic' },
      { id: 'dimsum', name: 'Dimsum Hangat', emoji: '🥟', note: 'kekasih gua 🥺🫰🏻', category: 'Food' },
      { id: 'teaching', name: 'Mengajari Orang Lain', emoji: '👩‍🏫', note: 'Berbagi ilmu itu menyenangkan', category: 'Life' },
      { id: 'tulus', name: 'Penyanyi Tulus', emoji: '🎙️', note: 'penyanyi kesukaan gua bgt 🤤🤤', category: 'Music' },
      { id: 'sleep', name: 'Tidur Nyenyak', emoji: '😴', note: 'Recharge energi paling ampuh', category: 'Life' },
      { id: 'study', name: 'Belajar Hal Baru', emoji: '📚', note: 'Selalu penasaran & ambisius', category: 'Life' },
      { id: 'flowers-again', name: 'Buket Bunga', emoji: '🌸', note: 'Hadiah manis yang tak pernah gagal', category: 'Nature' },
      { id: 'novel', name: 'Membaca Buku Novel', emoji: '📖', note: 'Masuk ke dunia fiksi & fantasi', category: 'Hobby' },
      { id: 'icecream', name: 'Ice Cream Manis', emoji: '🍦', note: 'Penyegar mood saat santai', category: 'Food' }
    ];

    const SVG_STICKERS = [
      { id: 'ribbon', label: 'Pita Pink', svg: `<svg viewBox="0 0 100 100"><path d="M50 45 C30 20 10 35 30 55 C40 65 50 50 50 50 C50 50 60 65 70 55 C90 35 70 20 50 45 Z" fill="#fb7185"/><circle cx="50" cy="48" r="6" fill="#be185d"/><path d="M45 52 L25 85 L38 80 L50 58 L62 80 L75 85 L55 52 Z" fill="#f43f5e"/></svg>` },
      { id: 'heart', label: 'Hati Sparkle', svg: `<svg viewBox="0 0 100 100"><path d="M50 30 C40 10 10 20 10 45 C10 65 50 90 50 90 C50 90 90 65 90 45 C90 20 60 10 50 30 Z" fill="#f43f5e"/><path d="M25 30 Q30 20 40 25" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/></svg>` },
      { id: 'tulip', label: 'Bunga Tulip', svg: `<svg viewBox="0 0 100 100"><path d="M50 90 L50 50" stroke="#4ade80" stroke-width="6"/><path d="M50 70 Q30 65 20 75 Q35 85 50 75" fill="#22c55e"/><path d="M30 45 C20 20 40 10 50 30 C60 10 80 20 70 45 C65 55 35 55 30 45 Z" fill="#fb7185"/></svg>` },
      { id: 'sparkle', label: 'Bintang Emas', svg: `<svg viewBox="0 0 100 100"><path d="M50 10 Q50 50 10 50 Q50 50 50 90 Q50 50 90 50 Q50 50 50 10 Z" fill="#facc15"/></svg>` },
      { id: 'cherry', label: 'Cherry', svg: `<svg viewBox="0 0 100 100"><path d="M35 50 Q50 20 70 25" stroke="#15803d" stroke-width="4" fill="none"/><circle cx="30" cy="65" r="18" fill="#881337"/><circle cx="65" cy="70" r="18" fill="#9f1239"/><circle cx="24" cy="58" r="4" fill="#ffffff"/><circle cx="59" cy="63" r="4" fill="#ffffff"/></svg>` },
      { id: 'badge', label: 'Badge Love', svg: `<svg viewBox="0 0 160 50"><rect x="5" y="5" width="150" height="40" rx="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="80" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e11d48" text-anchor="middle">made with love ♡</text></svg>` }
    ];

    // ==========================================
    // 2. MAIN APPLICATION COMPONENT
    // ==========================================
    function PinkieBoothApp() {
      // Navigation
      const [activeTab, setActiveTab] = useState('landing'); // landing, studio, editor, collection, gallery

      // Camera & Capture State
      const [stream, setStream] = useState(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState('');
      const [facingMode, setFacingMode] = useState('user');
      const [capturedPhotos, setCapturedPhotos] = useState([]);
      const [layout, setLayout] = useState('4-strip'); // 1-pic, 2-strip, 3-strip, 4-strip, 4-grid
      const [countdown, setCountdown] = useState(5);
      const [countdownTimer, setCountdownTimer] = useState(null);
      const [isCapturing, setIsCapturing] = useState(false);
      const [capturedCount, setCapturedCount] = useState(0);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [mirrorCamera, setMirrorCamera] = useState(true);
      const [flashEffect, setFlashEffect] = useState(false);
      const [activeFilter, setActiveFilter] = useState('soft-pink');

      // Customization & Canvas Editor State
      const [selectedTheme, setSelectedTheme] = useState(THEMES[0]);
      const [customBgColor, setCustomBgColor] = useState('#ffe4e6');
      const [customBorderColor, setCustomBorderColor] = useState('#f43f5e');
      const [customFrameColor, setCustomFrameColor] = useState('#ffffff');
      const [borderWidth, setBorderWidth] = useState(12);

      // Canvas Interactive Elements (Stickers & Texts)
      const [stickersOnCanvas, setStickersOnCanvas] = useState([]);
      const [selectedStickerId, setSelectedStickerId] = useState(null);
      const [customTexts, setCustomTexts] = useState([
        { id: 'default-title', text: 'Pinkie Booth ♡', x: 200, y: 35, color: '#e11d48', fontSize: 22 }
      ]);
      const [newText, setNewText] = useState('');

      // Saved Gallery
      const [savedGallery, setSavedGallery] = useState(() => {
        try {
          const stored = localStorage.getItem('pinkie_booth_gallery');
          return stored ? JSON.parse(stored) : [];
        } catch(e) { return []; }
      });

      // Toast Notification
      const [toastMessage, setToastMessage] = useState('');

      // Refs
      const videoRef = useRef(null);
      const compositedCanvasRef = useRef(null);
      const fileInputRef = useRef(null);
      const customStickerInputRef = useRef(null);

      // Toast Handler
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      // Web Audio API Synth Shutter Sound
      const playShutterSound = () => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch (e) {
          console.log('Audio Context Sound Error:', e);
        }
      };

      // Camera Control Logic
      const startCamera = async () => {
        setCameraError('');
        try {
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          const newStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          setStream(newStream);
          if (videoRef.current) {
            videoRef.current.srcObject = newStream;
          }
          setCameraActive(true);
        } catch (err) {
          setCameraError('Kamera tidak dapat diakses atau izin ditolak. Kamu tetap bisa mengunggah foto dari galeri!');
          setCameraActive(false);
        }
      };

      const stopCamera = () => {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          setStream(null);
        }
        setCameraActive(false);
      };

      useEffect(() => {
        if (activeTab === 'studio') {
          startCamera();
        } else {
          stopCamera();
        }
        return () => stopCamera();
      }, [activeTab, facingMode]);

      // Re-initialize Lucide Icons on DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Photo Capture Logic
      const getRequiredPhotosCount = () => {
        switch (layout) {
          case '1-pic': return 1;
          case '2-strip': return 2;
          case '3-strip': return 3;
          case '4-strip': return 4;
          case '4-grid': return 4;
          default: return 4;
        }
      };

      const startPhotoSession = () => {
        setCapturedPhotos([]);
        setIsCapturing(true);
        setCapturedCount(0);
        captureNextPhoto(0, getRequiredPhotosCount());
      };

      const captureNextPhoto = (currentStep, totalSteps) => {
        let timer = countdown;
        setCountdownTimer(timer);

        const interval = setInterval(() => {
          timer -= 1;
          setCountdownTimer(timer);

          if (timer <= 0) {
            clearInterval(interval);
            setCountdownTimer(null);

            // Flash & Sound
            setFlashEffect(true);
            playShutterSound();
            setTimeout(() => setFlashEffect(false), 200);

            // Snap photo from Video element
            if (videoRef.current) {
              const video = videoRef.current;
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = video.videoWidth || 640;
              tempCanvas.height = video.videoHeight || 480;
              const ctx = tempCanvas.getContext('2d');

              if (mirrorCamera && facingMode === 'user') {
                ctx.translate(tempCanvas.width, 0);
                ctx.scale(-1, 1);
              }
              ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
              const dataUrl = tempCanvas.toDataURL('image/png');

              setCapturedPhotos(prev => {
                const updated = [...prev, dataUrl];
                if (updated.length < totalSteps) {
                  setCapturedCount(updated.length);
                  setTimeout(() => captureNextPhoto(updated.length, totalSteps), 1200);
                } else {
                  setIsCapturing(false);
                  showToast('Sesi foto selesai! Hias foto cantikmu ♡');
                  setActiveTab('editor');
                }
                return updated;
              });
            }
          }
        }, 1000);
      };

      // File Upload Fallback
      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
          const newPhotos = [];
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
              newPhotos.push(event.target.result);
              if (newPhotos.length === files.length) {
                setCapturedPhotos(prev => [...prev, ...newPhotos].slice(0, getRequiredPhotosCount()));
                setActiveTab('editor');
                showToast('Foto berhasil diunggah!');
              }
            };
            reader.readAsDataURL(file);
          });
        }
      };

      // Upload Custom PNG Sticker
      const handleCustomStickerUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const imgData = event.target.result;
            const newSticker = {
              id: 'custom-' + Date.now(),
              type: 'image',
              src: imgData,
              x: 200,
              y: 200,
              scale: 0.8,
              rotation: 0
            };
            setStickersOnCanvas(prev => [...prev, newSticker]);
            showToast('Stiker kustom berhasil ditambahkan!');
          };
          reader.readAsDataURL(file);
        }
      };

      // Add Sticker to Canvas Logic
      const addSvgStickerToCanvas = (svgContent) => {
        const newSticker = {
          id: 'sticker-' + Date.now(),
          type: 'svg',
          svg: svgContent,
          x: 150 + Math.floor(Math.random() * 100),
          y: 200 + Math.floor(Math.random() * 100),
          scale: 1,
          rotation: Math.floor(Math.random() * 30) - 15
        };
        setStickersOnCanvas(prev => [...prev, newSticker]);
        showToast('Stiker ditambahkan ke canvas! 🎀');
      };

      const addEmojiStickerToCanvas = (emoji, label) => {
        const newSticker = {
          id: 'emoji-' + Date.now(),
          type: 'emoji',
          emoji: emoji,
          x: 160 + Math.floor(Math.random() * 80),
          y: 220 + Math.floor(Math.random() * 80),
          scale: 1.2,
          rotation: Math.floor(Math.random() * 20) - 10
        };
        setStickersOnCanvas(prev => [...prev, newSticker]);
        showToast(`Stiker ${label || emoji} berhasil ditambahkan! ✨`);
      };

      // Add Custom Text
      const handleAddText = () => {
        if (!newText.trim()) return;
        setCustomTexts(prev => [
          ...prev,
          { id: 'txt-' + Date.now(), text: newText, x: 200, y: 550, color: selectedTheme.text, fontSize: 18 }
        ]);
        setNewText('');
        showToast('Teks berhasil ditambahkan!');
      };

      // CANVAS COMPOSITING RENDER ENGINE
      useEffect(() => {
        if (activeTab !== 'editor' || !compositedCanvasRef.current) return;

        const canvas = compositedCanvasRef.current;
        const ctx = canvas.getContext('2d');

        const width = 400;
        let height = 600;

        if (layout === '4-strip') height = 960;
        if (layout === '3-strip') height = 760;
        if (layout === '2-strip') height = 540;
        if (layout === '1-pic') height = 460;
        if (layout === '4-grid') height = 520;

        canvas.width = width;
        canvas.height = height;

        // 1. Draw Background
        ctx.fillStyle = customBgColor;
        ctx.fillRect(0, 0, width, height);

        // 2. Draw Theme Patterns
        if (selectedTheme.pattern === 'polka') {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          for (let x = 12; x < width; x += 28) {
            for (let y = 12; y < height; y += 28) {
              ctx.beginPath();
              ctx.arc(x, y, 3.5, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else if (selectedTheme.pattern === 'hearts') {
          ctx.fillStyle = 'rgba(244, 63, 94, 0.15)';
          ctx.font = '14px font-cute';
          for (let x = 15; x < width; x += 45) {
            for (let y = 20; y < height; y += 45) {
              ctx.fillText('♥', x, y);
            }
          }
        }

        // 3. Draw Outer Border
        ctx.strokeStyle = customBorderColor;
        ctx.lineWidth = borderWidth;
        ctx.strokeRect(borderWidth / 2, borderWidth / 2, width - borderWidth, height - borderWidth);

        // 4. Calculate Photo Slot Geometry
        const photoSlots = [];
        const p = 14 + borderWidth;
        const availW = width - (p * 2);
        const availH = height - (p * 2) - 60; // Extra room for header title

        if (layout === '4-strip') {
          const hEach = (availH - (p * 3)) / 4;
          for (let i = 0; i < 4; i++) {
            photoSlots.push({ x: p, y: p + 35 + i * (hEach + p), w: availW, h: hEach });
          }
        } else if (layout === '3-strip') {
          const hEach = (availH - (p * 2)) / 3;
          for (let i = 0; i < 3; i++) {
            photoSlots.push({ x: p, y: p + 35 + i * (hEach + p), w: availW, h: hEach });
          }
        } else if (layout === '2-strip') {
          const hEach = (availH - p) / 2;
          for (let i = 0; i < 2; i++) {
            photoSlots.push({ x: p, y: p + 35 + i * (hEach + p), w: availW, h: hEach });
          }
        } else if (layout === '1-pic') {
          photoSlots.push({ x: p, y: p + 35, w: availW, h: availH });
        } else if (layout === '4-grid') {
          const wEach = (availW - p) / 2;
          const hEach = (availH - p) / 2;
          photoSlots.push(
            { x: p, y: p + 35, w: wEach, h: hEach },
            { x: p + wEach + p, y: p + 35, w: wEach, h: hEach },
            { x: p, y: p + 35 + hEach + p, w: wEach, h: hEach },
            { x: p + wEach + p, y: p + 35 + hEach + p, w: wEach, h: hEach }
          );
        }

        // 5. Draw Photo Slots and Filtered Images
        photoSlots.forEach((slot, idx) => {
          ctx.fillStyle = customFrameColor;
          ctx.fillRect(slot.x, slot.y, slot.w, slot.h);

          if (capturedPhotos[idx]) {
            const img = new Image();
            img.src = capturedPhotos[idx];
            img.onload = () => {
              ctx.save();
              ctx.beginPath();
              ctx.rect(slot.x, slot.y, slot.w, slot.h);
              ctx.clip();

              // Photo Filter application
              if (activeFilter === 'soft-pink') ctx.filter = 'sepia(0.25) hue-rotate(310deg) saturate(1.3) brightness(1.05)';
              if (activeFilter === 'vintage-warm') ctx.filter = 'sepia(0.45) contrast(1.1) saturate(1.2)';
              if (activeFilter === 'dreamy-glow') ctx.filter = 'brightness(1.15) contrast(0.95) saturate(1.4)';
              if (activeFilter === 'bw-chic') ctx.filter = 'grayscale(1) contrast(1.25)';
              if (activeFilter === 'y2k-sepia') ctx.filter = 'sepia(0.85) contrast(1.3) brightness(0.95)';

              // Crop & Scale Cover Fit
              const imgRatio = img.width / img.height;
              const slotRatio = slot.w / slot.h;
              let renderW = slot.w;
              let renderH = slot.h;
              let offsetX = slot.x;
              let offsetY = slot.y;

              if (imgRatio > slotRatio) {
                renderW = slot.h * imgRatio;
                offsetX = slot.x - (renderW - slot.w) / 2;
              } else {
                renderH = slot.w / imgRatio;
                offsetY = slot.y - (renderH - slot.h) / 2;
              }

              ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
              ctx.restore();
            };
          } else {
            // Empty Slot placeholder
            ctx.fillStyle = '#fce7f3';
            ctx.fillRect(slot.x, slot.y, slot.w, slot.h);
            ctx.fillStyle = '#f43f5e';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`Foto ${idx + 1}`, slot.x + slot.w / 2, slot.y + slot.h / 2);
          }
        });

        // 6. Draw Custom Texts
        customTexts.forEach(txt => {
          ctx.fillStyle = txt.color;
          ctx.font = `bold ${txt.fontSize}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(txt.text, txt.x, txt.y);
        });

        // 7. Draw Canvas Stickers
        stickersOnCanvas.forEach(st => {
          if (st.type === 'emoji') {
            ctx.save();
            ctx.translate(st.x, st.y);
            ctx.rotate((st.rotation * Math.PI) / 180);
            ctx.font = `${Math.round(36 * st.scale)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(st.emoji, 0, 0);
            ctx.restore();
          } else if (st.type === 'svg') {
            const img = new Image();
            const svgBlob = new Blob([st.svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            img.src = url;
            img.onload = () => {
              ctx.save();
              ctx.translate(st.x, st.y);
              ctx.rotate((st.rotation * Math.PI) / 180);
              ctx.scale(st.scale, st.scale);
              ctx.drawImage(img, -25, -25, 50, 50);
              ctx.restore();
              URL.revokeObjectURL(url);
            };
          } else if (st.type === 'image') {
            const img = new Image();
            img.src = st.src;
            img.onload = () => {
              ctx.save();
              ctx.translate(st.x, st.y);
              ctx.rotate((st.rotation * Math.PI) / 180);
              ctx.scale(st.scale, st.scale);
              ctx.drawImage(img, -40, -40, 80, 80);
              ctx.restore();
            };
          }
        });

              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                {PERSONAL_ITEMS.map(item => (
                  <div
                    key={item.id}
                    className="bg-white p-4 rounded-2xl border border-pink-200 hover:border-pink-400 hover:shadow-md transition flex flex-col justify-between group"
                  >
                    <div>
                      <div className="text-4xl mb-2 text-center group-hover:scale-110 transition">{item.emoji}</div>
                      <h3 className="font-bold text-slate-800 text-xs text-center">{item.name}</h3>
                      <p className="text-[11px] text-rose-500 text-center italic mt-1 font-handwritten">{item.note}</p>
                    </div>

                    <button
                      onClick={() => {
                        addEmojiStickerToCanvas(item.emoji, item.name);
                        setActiveTab('editor');
                      }}
                      className="mt-3 w-full py-2 bg-pink-50 hover:bg-pink-100 text-rose-600 rounded-xl text-[11px] font-bold transition flex items-center justify-center gap-1 border border-pink-200"
                    >
                      <i data-lucide="plus" className="w-3 h-3"></i> Stikerkan ✦
                    </button>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* ========================================== */}
          {/* TAB 5: PHOTO GALLERY                       */}
          {/* ========================================== */}
          {}
          {activeTab === 'gallery' && (
            <main className="flex-1 max-w-5xl mx-auto px-4 py-8">
              <div className="text-center max-w-xl mx-auto mb-8">
                <h2 className="text-3xl font-black text-slate-800">Galeri Kenangan Tersimpan ✨</h2>
                <p className="text-slate-500 text-xs mt-1 font-medium">Koleksi foto-foto manis yang telah kamu buat di Pinkie Booth.</p>
              </div>

              {savedGallery.length === 0 ? (
                <div className="bg-white p-12 rounded-3xl border border-pink-200 text-center max-w-md mx-auto shadow-xs">
                  <div className="text-5xl mb-3">🖼️</div>
                  <h3 className="font-bold text-slate-700 text-sm">Belum Ada Foto Tersimpan</h3>
                  <p className="text-slate-400 text-xs mt-1 mb-4 font-medium">Ambil foto pertamamu dan simpan ke galeri lokal ini!</p>
                  <button
                    onClick={() => setActiveTab('studio')}
                    className="bg-rose-500 hover:bg-rose-600 text-white font-bold px-6 py-2.5 rounded-full text-xs shadow-md transition"
                  >
                    Mulai Foto Now 📸
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-6">
                  {savedGallery.map(item => (
                    <div key={item.id} className="bg-white p-3 rounded-2xl border border-pink-200 shadow-xs flex flex-col items-center">
                      <img src={item.dataUrl} alt="Memori" className="rounded-xl max-h-80 object-contain mb-2 border border-pink-100" />
                      <span className="text-[10px] font-bold text-slate-400">{item.date}</span>
                      <a
                        href={item.dataUrl}
                        download={`pinkie-booth-${item.id}.png`}
                        className="mt-2 text-xs font-bold text-rose-500 hover:underline flex items-center gap-1"
                      >
                        <i data-lucide="download" className="w-3 h-3"></i> Unduh Lagi
                      </a>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* Footer */}
          {}
          <footer className="mt-12 border-t border-pink-200 bg-white py-6 text-center text-xs text-pink-400 font-medium">
            <p>Pinkie Booth — Your Little Cute World ♡ Made with lots of love</p>
          </footer>

        </div>
      );
    }

    // Render React Application to Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PinkieBoothApp />);
  </script>
</body>
</html>
